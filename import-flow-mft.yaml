apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: import-flow-mft
  title: Import flow for TIBCO MFT (Command Center, Internet Server, Platform Server)
  description: >-
    Reads a live TIBCO MFT Command Center through its REST API and generates catalog entities for servers,
    transfer definitions (Platform Server and Internet Server, inbound and outbound), Internet Server protocol
    endpoints, partner users and certificates, with certificate-expiry and insecure-transport findings and a
    TechDocs skeleton. Writes them to a new or an existing git repository and registers them.
  tags:
    - import-flow
    - tibco
    - mft
    - managed-file-transfer
    - developer-hub
spec:
  owner: group:default/tibco-imported
  type: integration

  parameters:
    - title: Command Center
      required:
        - apiVersion
        - ccUrl
        - ccUser
        - ccPassword
      properties:
        apiVersion:
          title: REST API version
          type: string
          default: v7
          enum: [v7, v6, v5, v4, v3, v2]
          description: >-
            The version segment in the Command Center REST paths (/cfcc/rest/admin/<version>/servers). It depends on the
            MFT release, and the flow uses it for every call. To find yours, run
            curl -u <user> <Command Center URL>/cfcc/public/docs/admin.json and look at the paths, or open
            <Command Center URL>/cfcc/public/docs/. MFT 8.7 uses v7. Older versions may lack some endpoints or fields;
            the flow tolerates missing fields but a missing endpoint stops the run, and the log shows which one.
        ccUrl:
          title: Command Center URL
          type: string
          description: >-
            Base URL of the Command Center web application, for example https://mft.example.com:8443 (the flow
            calls <url>/cfcc/rest/...). It must be reachable from the Developer Hub backend, which must also trust its
            TLS certificate (for a private CA set NODE_EXTRA_CA_CERTS for the Hub process). If
            scaffolder.tibcoCallPlatformApi.allowedHosts is configured, add this host to it.
        ccUser:
          title: Command Center user
          type: string
          description: A user allowed to use the administration REST API (read access is enough). Basic authentication is used.
        ccPassword:
          title: Command Center password
          type: string
          ui:field: Secret
          description: Kept as a scaffolder secret; never written to the repository.
        includeIS:
          title: Include Internet Server definitions
          type: boolean
          default: true
          description: Partner users, Internet Server transfers (inbound and outbound) and the protocol listeners.
        isHosts:
          title: Internet Server hosts
          type: string
          pattern: '^\s*[A-Za-z0-9][A-Za-z0-9._-]*(:[0-9]{1,5})?(\s*,\s*[A-Za-z0-9][A-Za-z0-9._-]*(:[0-9]{1,5})?)*\s*$'
          description: >-
            Comma separated list of the Internet Servers under this Command Center, as host or host:port, for example
            is1.example.com:7443,is2.example.com:7443. The host is the name the server is registered under in Command
            Center (no https://, no path); a wrong name gives a 404. The optional port is that server's HTTPS port
            (default: the HTTPS port below). Up to 8 hosts. To see the registered names open
            <Command Center URL>/cfcc/rest/admincc/${{ parameters.apiVersion }}/hoststats (ignore entries ending in _CC). Leave empty to skip
            the FTP / FTPS / SFTP / HTTPS listeners.
        httpsPort:
          title: Internet Server HTTPS port
          type: string
          default: '7443'
          description: Default HTTPS port for hosts listed without a port (the HTTPS listener has no REST configuration).
        warnDays:
          title: Certificate warning window (days)
          type: number
          default: 30
          description: Certificates expiring within this many days are tagged cert-expiring.

    - title: Repository Location
      required:
        - scm
        - repoUrl
        - repoMode
      properties:
        scm:
          title: Git provider
          type: string
          description: >-
            Which kind of git server hosts the repository (required, no default: a wrong
            choice produces catalog URLs the server does not understand). Needed because
            self-hosted servers cannot be told apart by their host name.
          enum: [github, gitlab, bitbucket-cloud, bitbucket-server, gitea]
          enumNames:
            - GitHub (github.com or Enterprise Server)
            - GitLab (gitlab.com or self-hosted)
            - Bitbucket Cloud (bitbucket.org)
            - Bitbucket Server / Data Center
            - Gitea / Forgejo
        repoUrl:
          title: Git repository for the generated catalog files
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            # Add your own git hosts here (self-hosted GitLab, Bitbucket Server, GitHub Enterprise, Gitea/Forgejo ...).
            # Each host also needs an entry under `integrations:` in the DevHub app-config, which supplies the
            # credentials used to clone and push.
            allowedHosts:
              - github.com
              - gitlab.com
              - bitbucket.org
              - git.vewins.co.uk   # example self-hosted Forgejo: replace with your own host(s)
        repoMode:
          title: Repository
          type: string
          default: existing
          enum: [existing, create]
          enumNames:
            - Use an existing repository (update it)
            - Create the repository (GitHub, GitLab, Gitea / Forgejo)
          description: >-
            Creating needs an API token (below). It is not offered for Bitbucket, whose API cannot create an
            initialised repository: create it there first and choose "existing".
        branch:
          title: Branch
          type: string
          default: main
          description: >-
            Branch to read from and to commit the generated files to. A newly created repository must use its
            default branch. If your branch is not in the list, type its name in "Other branch" below.
          enum: [main, master, develop, development, trunk]
        branchOther:
          title: Other branch (optional)
          type: string
          description: Exact branch name; when filled in it overrides the list above.
        outputFolder:
          title: Folder for the generated files
          type: string
          default: devhub-mft
          description: >-
            Created in the repository (relative to its root) and regenerated on every run, so entities for removed
            servers and transfers disappear. Files outside it are not touched.
      dependencies:
        repoMode:
          oneOf:
            - properties:
                repoMode:
                  enum: [existing]
            - properties:
                repoMode:
                  enum: [create]
                repoToken:
                  title: API token for creating the repository
                  type: string
                  ui:field: Secret
                  description: >-
                    Personal access token allowed to create repositories (GitHub: repo; GitLab: api; Gitea/Forgejo:
                    write:repository and write:organization or write:user). Used only for creation, never stored.
                ownerIsOrg:
                  title: The owner is an organisation or group, not my personal account
                  type: boolean
                  default: false
                repoPrivate:
                  title: Private repository
                  type: boolean
                  default: true
                repoDescription:
                  title: Repository description
                  type: string
                  default: TIBCO MFT catalog entities generated by Developer Hub
              required:
                - repoToken

    - title: Catalog details
      required:
        - owner
        - system
      properties:
        system:
          title: System
          type: string
          description: Name of the System the MFT estate belongs to, e.g. managed-file-transfer.
        domain:
          title: Domain (optional)
          type: string
          description: Domain of the System, e.g. file-exchange.
        owner:
          title: Owner
          type: string
          description: Owner of the generated entities
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
        lifecycle:
          title: Lifecycle
          type: string
          default: production
          enum: [experimental, production, deprecated]
        createSystem:
          title: Also create the System and Domain entities
          type: boolean
          default: false
          description: Tick if the System/Domain do not exist in the catalog yet.
        instance:
          title: Instance name
          type: string
          default: mft
          description: Short name of this Command Center. It prefixes every entity name (<instance>-srv-..., <instance>-is-...), so use a different one per Command Center.

  # 1. Optionally create the repository (GitHub, GitLab, Gitea/Forgejo, initialised with a README)
  # 2. Clone it
  # 3. Read the Command Center REST API (servers, certificates, transfers, Internet Server users/listeners)
  # 4. Generate catalog-info.yaml, a raw snapshot and a TechDocs skeleton into the output folder
  # 5. Commit to the branch and register in the catalog
  steps:
    - id: createGithub
      name: Create the GitHub Repository
      if: ${{ parameters.repoMode == "create" and parameters.scm == "github" }}
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ "https://api.github.com" if (parameters.repoUrl | parseRepoUrl).host == "github.com" else ("https://" + (parameters.repoUrl | parseRepoUrl).host + "/api/v3") }}
        endpoint: ${{ ("/orgs/" + (parameters.repoUrl | parseRepoUrl).owner + "/repos") if parameters.ownerIsOrg else "/user/repos" }}
        method: POST
        requireAuth: false
        headers:
          authorization: ${{ "Bearer " + secrets.repoToken }}
          accept: application/vnd.github+json
        body:
          name: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          description: ${{ parameters.repoDescription }}
          private: ${{ parameters.repoPrivate }}
          auto_init: true

    - id: gitlabNamespace
      name: Look up the GitLab Namespace
      if: ${{ parameters.repoMode == "create" and parameters.scm == "gitlab" }}
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ "https://" + (parameters.repoUrl | parseRepoUrl).host + "/api/v4" }}
        endpoint: ${{ "/namespaces/" + ((parameters.repoUrl | parseRepoUrl).owner | replace("/", "%2F")) }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Bearer " + secrets.repoToken }}

    - id: createGitlab
      name: Create the GitLab Project
      if: ${{ parameters.repoMode == "create" and parameters.scm == "gitlab" }}
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ "https://" + (parameters.repoUrl | parseRepoUrl).host + "/api/v4" }}
        endpoint: /projects
        method: POST
        requireAuth: false
        headers:
          authorization: ${{ "Bearer " + secrets.repoToken }}
        body:
          name: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          path: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          namespace_id: ${{ steps.gitlabNamespace.output.data.id }}
          description: ${{ parameters.repoDescription }}
          visibility: ${{ "private" if parameters.repoPrivate else "public" }}
          initialize_with_readme: true
          default_branch: ${{ (parameters.branchOther or parameters.branch) }}

    - id: createGitea
      name: Create the Gitea / Forgejo Repository
      if: ${{ parameters.repoMode == "create" and parameters.scm == "gitea" }}
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ "https://" + (parameters.repoUrl | parseRepoUrl).host }}
        endpoint: ${{ ("/api/v1/orgs/" + (parameters.repoUrl | parseRepoUrl).owner + "/repos") if parameters.ownerIsOrg else "/api/v1/user/repos" }}
        method: POST
        requireAuth: false
        headers:
          authorization: ${{ "token " + secrets.repoToken }}
        body:
          name: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          description: ${{ parameters.repoDescription }}
          private: ${{ parameters.repoPrivate }}
          auto_init: true
          default_branch: ${{ (parameters.branchOther or parameters.branch) }}

    - id: clone
      name: Clone the Repository
      action: tibco:git:clone
      input:
        failOnError: true
        branch: ${{ (parameters.branchOther or parameters.branch) }}
        repoUrl: ${{ "https://" + (parameters.repoUrl | parseRepoUrl).host + ("/scm/" if parameters.scm == "bitbucket-server" else "/") + ((parameters.repoUrl | parseRepoUrl).workspace if parameters.scm == "bitbucket-cloud" else ((parameters.repoUrl | parseRepoUrl).project if parameters.scm == "bitbucket-server" else (parameters.repoUrl | parseRepoUrl).owner)) + "/" + (parameters.repoUrl | parseRepoUrl).repo + (".git" if parameters.scm == "bitbucket-server" else "") }}

    - id: ccServers
      name: Read Servers
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/servers
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccPublicKeys
      name: Read Stored Server Certificates
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/protocolpublickeys?keyType=All&userServerFlag=Server
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccSystemKeys
      name: Read System Keys
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/protocolsystemkeys
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccPsTransfers
      name: Read Platform Server Transfers
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admincc/${{ parameters.apiVersion }}/pstransfers
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccUsers
      name: Read Internet Server Users
      if: ${{ parameters.includeIS }}
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/users
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsTransfers
      name: Read Internet Server Transfers
      if: ${{ parameters.includeIS }}
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/transfers
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsFtp1
      name: Read Internet Server 1 FTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 0 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ftp/${{ (((parameters.isHosts | replace(" ", "")).split(","))[0]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsSsh1
      name: Read Internet Server 1 SFTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 0 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ssh/${{ (((parameters.isHosts | replace(" ", "")).split(","))[0]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsFtp2
      name: Read Internet Server 2 FTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 1 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ftp/${{ (((parameters.isHosts | replace(" ", "")).split(","))[1]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsSsh2
      name: Read Internet Server 2 SFTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 1 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ssh/${{ (((parameters.isHosts | replace(" ", "")).split(","))[1]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsFtp3
      name: Read Internet Server 3 FTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 2 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ftp/${{ (((parameters.isHosts | replace(" ", "")).split(","))[2]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsSsh3
      name: Read Internet Server 3 SFTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 2 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ssh/${{ (((parameters.isHosts | replace(" ", "")).split(","))[2]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsFtp4
      name: Read Internet Server 4 FTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 3 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ftp/${{ (((parameters.isHosts | replace(" ", "")).split(","))[3]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsSsh4
      name: Read Internet Server 4 SFTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 3 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ssh/${{ (((parameters.isHosts | replace(" ", "")).split(","))[3]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsFtp5
      name: Read Internet Server 5 FTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 4 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ftp/${{ (((parameters.isHosts | replace(" ", "")).split(","))[4]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsSsh5
      name: Read Internet Server 5 SFTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 4 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ssh/${{ (((parameters.isHosts | replace(" ", "")).split(","))[4]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsFtp6
      name: Read Internet Server 6 FTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 5 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ftp/${{ (((parameters.isHosts | replace(" ", "")).split(","))[5]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsSsh6
      name: Read Internet Server 6 SFTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 5 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ssh/${{ (((parameters.isHosts | replace(" ", "")).split(","))[5]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsFtp7
      name: Read Internet Server 7 FTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 6 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ftp/${{ (((parameters.isHosts | replace(" ", "")).split(","))[6]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsSsh7
      name: Read Internet Server 7 SFTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 6 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ssh/${{ (((parameters.isHosts | replace(" ", "")).split(","))[6]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsFtp8
      name: Read Internet Server 8 FTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 7 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ftp/${{ (((parameters.isHosts | replace(" ", "")).split(","))[7]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccIsSsh8
      name: Read Internet Server 8 SFTP Listener
      if: ${{ parameters.includeIS and parameters.isHosts and ((parameters.isHosts | replace(" ", "")).split(",")).length > 7 }}
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/tranferserverconfig/ssh/${{ (((parameters.isHosts | replace(" ", "")).split(","))[7]).split(":")[0] }}
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccVersion
      name: Read Version
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/mft/version
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: ccLicense
      name: Read Licence
      continueOnError: true
      action: tibco:call-platform-api
      input:
        baseUrl: ${{ parameters.ccUrl }}
        endpoint: /cfcc/rest/admin/${{ parameters.apiVersion }}/mft/licenseinfo
        method: GET
        requireAuth: false
        headers:
          authorization: ${{ "Basic " + ((parameters.ccUser + ":" + secrets.ccPassword) | encodeBase64) }}

    - id: generate
      name: Generate Catalog Entities and Docs
      action: fetch:template
      input:
        url: ./entity-skeletons-mft/
        targetPath: ${{ parameters.outputFolder }}
        templateFileExtension: true
        # Re-running must regenerate the files (fetch:template skips existing files by default).
        replace: true
        values:
          scm: ${{ parameters.scm }}
          repoUrl: ${{ parameters.repoUrl }}
          branch: ${{ (parameters.branchOther or parameters.branch) }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          domain: ${{ parameters.domain }}
          lifecycle: ${{ parameters.lifecycle }}
          createSystem: ${{ parameters.createSystem }}
          outputFolder: ${{ parameters.outputFolder }}
          instance: ${{ parameters.instance }}
          ccUrl: ${{ parameters.ccUrl }}
          includeIS: ${{ parameters.includeIS }}
          isHosts: ${{ parameters.isHosts }}
          httpsPort: ${{ parameters.httpsPort }}
          warnDays: ${{ parameters.warnDays }}
          ccDate: ${{ steps.ccServers.output.headers.date }}
          servers: ${{ steps.ccServers.output.data }}
          publicKeys: ${{ steps.ccPublicKeys.output.data }}
          systemKeys: ${{ steps.ccSystemKeys.output.data }}
          psTransfers: ${{ steps.ccPsTransfers.output.data }}
          users: ${{ steps.ccUsers.output.data }}
          isTransfers: ${{ steps.ccIsTransfers.output.data }}
          isFtp1: ${{ steps.ccIsFtp1.output.data }}
          isSsh1: ${{ steps.ccIsSsh1.output.data }}
          isFtp2: ${{ steps.ccIsFtp2.output.data }}
          isSsh2: ${{ steps.ccIsSsh2.output.data }}
          isFtp3: ${{ steps.ccIsFtp3.output.data }}
          isSsh3: ${{ steps.ccIsSsh3.output.data }}
          isFtp4: ${{ steps.ccIsFtp4.output.data }}
          isSsh4: ${{ steps.ccIsSsh4.output.data }}
          isFtp5: ${{ steps.ccIsFtp5.output.data }}
          isSsh5: ${{ steps.ccIsSsh5.output.data }}
          isFtp6: ${{ steps.ccIsFtp6.output.data }}
          isSsh6: ${{ steps.ccIsSsh6.output.data }}
          isFtp7: ${{ steps.ccIsFtp7.output.data }}
          isSsh7: ${{ steps.ccIsSsh7.output.data }}
          isFtp8: ${{ steps.ccIsFtp8.output.data }}
          isSsh8: ${{ steps.ccIsSsh8.output.data }}
          version: ${{ steps.ccVersion.output.data }}
          license: ${{ steps.ccLicense.output.data }}

    - id: push
      name: Commit the Generated Files
      action: tibco:git:push
      input:
        failOnError: true
        branch: ${{ (parameters.branchOther or parameters.branch) }}
        commitMessage: Add catalog entities generated by the MFT import flow

    - id: register
      name: Register in the Catalog
      action: catalog:register
      input:
        catalogInfoUrl: ${{ (("https://" + (parameters.repoUrl | parseRepoUrl).host + "/projects/" + ((parameters.repoUrl | parseRepoUrl).workspace if parameters.scm == "bitbucket-cloud" else ((parameters.repoUrl | parseRepoUrl).project if parameters.scm == "bitbucket-server" else (parameters.repoUrl | parseRepoUrl).owner)) + "/repos/" + (parameters.repoUrl | parseRepoUrl).repo + "/browse/" + parameters.outputFolder + "/catalog-info.yaml" + "?at=refs/heads/" + (parameters.branchOther or parameters.branch)) if parameters.scm == "bitbucket-server" else ("https://" + (parameters.repoUrl | parseRepoUrl).host + "/" + ((parameters.repoUrl | parseRepoUrl).workspace if parameters.scm == "bitbucket-cloud" else ((parameters.repoUrl | parseRepoUrl).project if parameters.scm == "bitbucket-server" else (parameters.repoUrl | parseRepoUrl).owner)) + "/" + (parameters.repoUrl | parseRepoUrl).repo + ("/blob/" if parameters.scm == "github" else ("/-/blob/" if parameters.scm == "gitlab" else ("/src/" if parameters.scm == "bitbucket-cloud" else "/src/branch/"))) + (parameters.branchOther or parameters.branch) + "/" + parameters.outputFolder + "/catalog-info.yaml")) }}

  output:
    links:
      - title: Open in catalog (Command Center)
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: TIBCO MFT documentation
        icon: catalog
        url: https://docs.tibco.com/products/tibco-mft-platform-server
