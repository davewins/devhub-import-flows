---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: orderprocessing-api
  title: api
  description: BusinessWorks shared resource (httpConnResource) defined in OrderProcessing.module/Resources/orderprocessing/module/api.httpConnResource
  tags:
  - businessworks
  - shared-resource
  annotations:
    backstage.io/source-location: url:https://git.vewins.co.uk/dave/OrderProcessingApplication/blob/main/OrderProcessing.module/Resources/orderprocessing/module/api.httpConnResource
    tibco.com/bw-resource-type: httpConnResource
