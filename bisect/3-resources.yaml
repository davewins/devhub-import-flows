apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: orderprocessing-ems-broker
  title: TIBCO EMS broker
  description: Message broker used by OrderProcessing, taken from the project's deployment
    configuration.
  tags:
  - tibco-ems
  - messaging
  annotations:
    tibco.com/ems-url: tcp://192.168.1.30:9011
spec:
  type: message-broker
  owner: group:default/finance-department
  system: order-management-system
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: orderprocessing-queue-orders
  title: Orders
  description: EMS queue Orders (configuration variable OrdersQueue)
  tags:
  - tibco-ems
  - queue
  annotations:
    tibco.com/destination-name: Orders
    tibco.com/config-variable: OrdersQueue
spec:
  type: jms-queue
  owner: group:default/finance-department
  system: order-management-system
  dependsOn:
  - resource:default/orderprocessing-ems-broker
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: orderprocessing-queue-logmessage
  title: LogMessage
  description: EMS queue LogMessage (configuration variable LogMessageQueue)
  tags:
