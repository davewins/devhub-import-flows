    tibco.com/config-variable: LogMessageQueue
spec:
  type: jms-queue
  owner: group:default/finance-department
  system: order-management-system
  dependsOn:
  - resource:default/orderprocessing-ems-broker
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: orderprocessing-queue-stockcheck
