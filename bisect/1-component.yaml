  - businessworks
  - bwce
  - jms
  - httpconnector
  - jmsconnection
  - rest
  - messaging
  links:
  - title: Repository
    url: https://git.vewins.co.uk/dave/OrderProcessingApplication
  - title: TIBCO BusinessWorks documentation
    url: https://docs.tibco.com/products/tibco-activematrix-businessworks
  annotations:
    backstage.io/source-location: url:https://git.vewins.co.uk/dave/OrderProcessingApplication/tree/main/
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: dave/OrderProcessingApplication
    tibco.com/bw-version: 2.10.0 HF2 V49 2025-03-21
    tibco.com/bw-edition: bwcf
    tibco.com/bw-processes: '11'
    tibco.com/bw-api-descriptors: '1'
