apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: import-flow-bw-deep
  title: Deep import flow for BusinessWorks (BW6 / BWCE) projects
  description: >-
    Reads an existing BusinessWorks project from git and generates the catalog
    entities (Component, APIs, Resources, optional System/Domain) and a TechDocs
    skeleton from what is in the project, then commits them and registers them.
  tags:
    - import-flow
    - tibco
    - business-works-6
    - business-works-container-edition
    - developer-hub
    - bwce
spec:
  owner: group:default/tibco-imported
  type: integration

  parameters:
    - title: Repository Location
      required:
        - scm
        - repoUrl
      properties:
        scm:
          title: Git provider
          type: string
          description: >-
            Which kind of git server hosts the repository (required, no default: a wrong
            choice produces catalog URLs the server does not understand). Needed because
            self-hosted servers cannot be told apart by their host name.
          enum:
            - github
            - gitlab
            - bitbucket-cloud
            - bitbucket-server
            - gitea
          enumNames:
            - GitHub (github.com or Enterprise Server)
            - GitLab (gitlab.com or self-hosted)
            - Bitbucket Cloud (bitbucket.org)
            - Bitbucket Server / Data Center
            - Gitea / Forgejo
        repoUrl:
          title: Git repository with an existing BusinessWorks project
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            # Add your own git hosts here (self-hosted GitLab, Bitbucket Server, GitHub
            # Enterprise, Gitea/Forgejo ...). Each host also needs an entry under
            # `integrations:` in the DevHub app-config, which is also what supplies the
            # credentials used to clone and push.
            allowedHosts:
              - github.com
              - gitlab.com
              - bitbucket.org
              - git.vewins.co.uk   # example self-hosted Forgejo: replace with your own host(s)
        branch:
          title: Branch
          type: string
          default: main
          description: >-
            Branch to read from and to commit the generated files to. If your branch is not
            in the list, leave this alone and type its name in "Other branch" below.
          enum:
            - main
            - master
            - develop
            - development
            - trunk
        branchOther:
          title: Other branch (optional)
          type: string
          description: >-
            Exact branch name, for example release/2.1 or feature/bw-import. When filled in it
            overrides the list above.
        application_folder:
          title: Project folder
          type: string
          default: '.'
          description: >-
            Folder in the repository that holds the BusinessWorks application and
            module projects. Use . if they sit at the repository root.
        application:
          title: Application name (optional)
          type: string
          description: >-
            Only needed when the folder holds several BW applications. Leave empty
            to import the first one found.

    - title: Catalog details
      required:
        - owner
        - system
      properties:
        system:
          title: System
          type: string
          description: Name of the System this application belongs to, e.g. order-management-system.
        domain:
          title: Domain (optional)
          type: string
          description: Domain of the System, e.g. sales-operations.
        owner:
          title: Owner
          type: string
          description: Owner of the generated entities
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
        lifecycle:
          title: Lifecycle
          type: string
          default: production
          enum:
            - experimental
            - production
            - deprecated
        createSystem:
          title: Also create the System and Domain entities
          type: boolean
          default: false
          description: Tick if the System/Domain do not exist in the catalog yet.
        infraMode:
          title: Message broker and queues
          type: string
          default: per-app
          enum:
            - per-app
            - shared-define
            - shared-reference
          enumNames:
            - Per application (unique entities for this app)
            - Shared - define the broker and queues from this import
            - Shared - reference broker and queues defined by another import
          description: >-
            Shared modes name the EMS broker and queues after their address, so several
            applications link to the same entities and the topology shows who uses each queue.
            A catalog entity can only be defined once - pick "define" for the first application
            and "reference" for the rest.
        processDiagrams:
          title: Draw process flow diagrams in the documentation
          type: boolean
          default: true
          description: >-
            Adds an SVG diagram of each process to the TechDocs. The SVG is drawn by the template
            itself, so nothing needs installing on the TechDocs host. The flow table is always generated.
        outputFolder:
          title: Folder for the generated files
          type: string
          default: devhub
          description: >-
            Created in the repository (relative to its root). Existing files in the
            project, including any catalog-info.yaml you wrote by hand, are not touched.

  # The deep import flow:
  # 1. Clone the repository
  # 2. Discover the project files (application, module, processes, shared resources, API descriptors)
  # 3. Extract names, versions, palettes, configuration variables (application profile over module defaults) and API metadata
  # 4. Generate catalog-info.yaml and a TechDocs skeleton from the skeletons
  # 5. Commit them to the branch and register them in the catalog
  steps:
    - id: clone
      name: Clone the Project
      action: tibco:git:clone
      input:
        failOnError: true
        branch: ${{ (parameters.branchOther or parameters.branch) }}
        repoUrl: ${{ "https://" + (parameters.repoUrl | parseRepoUrl).host + ("/scm/" if parameters.scm == "bitbucket-server" else "/") + ((parameters.repoUrl | parseRepoUrl).workspace if parameters.scm == "bitbucket-cloud" else ((parameters.repoUrl | parseRepoUrl).project if parameters.scm == "bitbucket-server" else (parameters.repoUrl | parseRepoUrl).owner)) + "/" + (parameters.repoUrl | parseRepoUrl).repo + (".git" if parameters.scm == "bitbucket-server" else "") }}

    - id: discover
      name: Discover Project Files
      action: tibco:extract-parameters
      input:
        failOnError: false
        sourcePath: ${{ parameters.application_folder }}
        extractParameters:
          bw_app_files:
            type: workspace
            glob: ${{ ("**/" + parameters.application + "/META-INF/TIBCO.xml") if parameters.application else "**/META-INF/TIBCO.xml" }}
            regex:
              regexPattern: 'TIBCO\.xml$'
          bw_module_files:
            type: workspace
            glob: '**/META-INF/module.bwm'
            regex:
              regexPattern: 'module\.bwm$'
          bw_processes:
            type: workspace
            glob: '**/*.bwp'
            regex:
              regexPattern: '\.bwp$'
          bw_resources:
            type: workspace
            glob: '**/Resources/**/*'
            regex:
              regexPattern: '\.[A-Za-z]+Resource$'
          bw_swagger_files:
            type: workspace
            glob: '**/Service Descriptors/*.json'
            regex:
              regexPattern: '\.json$'
          bw_wsdl_files:
            type: workspace
            glob: '**/Service Descriptors/*.wsdl'
            regex:
              regexPattern: '\.wsdl$'
          bw_schemas:
            type: workspace
            glob: '**/Schemas/*.xsd'
            regex:
              regexPattern: '\.xsd$'
          bw_tests:
            type: workspace
            glob: '**/Tests/**/*'
            regex:
              regexPattern: '\.(ml|bwt|json|xml)$'
          bw_artifacts:
            type: workspace
            glob: '**/*.ear'
            regex:
              regexPattern: '\.ear$'

    - id: extract
      name: Extract Project Details
      action: tibco:extract-parameters
      input:
        failOnError: false
        sourcePath: ${{ parameters.application_folder }}
        extractParameters:
          bw_app_name:
            type: xml
            filePath: ${{ (steps.discover.output.bw_app_files[0] | replace("/META-INF/TIBCO.xml", "")) + "/.project" }}
            jsonPath: '$.projectDescription.name'
          bw_app_description:
            type: xml
            filePath: ${{ (steps.discover.output.bw_app_files[0] | replace("/META-INF/TIBCO.xml", "")) + "/.project" }}
            jsonPath: '$.projectDescription.comment'
          bw_app_version:
            type: file
            filePath: ${{ (steps.discover.output.bw_app_files[0] | replace("/META-INF/TIBCO.xml", "")) + "/META-INF/MANIFEST.MF" }}
            regex:
              regexPattern: 'Bundle-Version: *(\S+)'
          bw_version:
            type: file
            filePath: ${{ (steps.discover.output.bw_app_files[0] | replace("/META-INF/TIBCO.xml", "")) + "/META-INF/MANIFEST.MF" }}
            regex:
              regexPattern: 'TIBCO-BW-Version: *([^\r\n]+)'
          bw_edition:
            type: file
            filePath: ${{ (steps.discover.output.bw_app_files[0] | replace("/META-INF/TIBCO.xml", "")) + "/META-INF/MANIFEST.MF" }}
            regex:
              regexPattern: 'TIBCO-BW-Edition: *(\w+)'
          bw_palettes:
            type: file
            filePath: ${{ (steps.discover.output.bw_module_files[0] | replace("/META-INF/module.bwm", "")) + "/META-INF/MANIFEST.MF" }}
            regex:
              regexPattern: 'name=(bw[A-Za-z0-9_.]*)'
              regexFlags: g
          bw_gv_names:
            type: xml
            filePath: ${{ (steps.discover.output.bw_app_files[0] | replace("/META-INF/TIBCO.xml", "")) + "/META-INF/default.substvar" }}
            jsonPath: '$.repository.globalVariables.globalVariable[*].name'
          bw_gv_values:
            type: xml
            filePath: ${{ (steps.discover.output.bw_app_files[0] | replace("/META-INF/TIBCO.xml", "")) + "/META-INF/default.substvar" }}
            jsonPath: '$.repository.globalVariables.globalVariable[*].value'
          bw_mod_gv_names:
            type: xml
            filePath: ${{ (steps.discover.output.bw_module_files[0] | replace("/META-INF/module.bwm", "")) + "/META-INF/default.substvar" }}
            jsonPath: '$.repository.globalVariables.globalVariable[*].name'
          bw_mod_gv_values:
            type: xml
            filePath: ${{ (steps.discover.output.bw_module_files[0] | replace("/META-INF/module.bwm", "")) + "/META-INF/default.substvar" }}
            jsonPath: '$.repository.globalVariables.globalVariable[*].value'
          bw_api_title:
            type: json
            filePath: ${{ steps.discover.output.bw_swagger_files[0] }}
            jsonPath: '$.info.title'
          bw_api_description:
            type: json
            filePath: ${{ steps.discover.output.bw_swagger_files[0] }}
            jsonPath: '$.info.description'
          bw_api_version:
            type: json
            filePath: ${{ steps.discover.output.bw_swagger_files[0] }}
            jsonPath: '$.info.version'
          bw_api_base_path:
            type: json
            filePath: ${{ steps.discover.output.bw_swagger_files[0] }}
            jsonPath: '$.basePath'
          bw_api_paths:
            type: json
            filePath: ${{ steps.discover.output.bw_swagger_files[0] }}
            jsonPath: '$.paths'

    # Deep analysis. The two steps below run once per process / schema file (`each`); Backstage collects
    # every output name into an array with one entry per iteration, in the same order as the file list.
    - id: module
      name: Read the Module Descriptor
      action: tibco:extract-parameters
      input:
        failOnError: false
        sourcePath: ${{ parameters.application_folder }}
        extractParameters:
          svc_names:
            type: xml
            filePath: ${{ steps.discover.output.bw_module_files[0] }}
            xPath: "/*/*[local-name()='service']/@name"
          svc_paths:
            type: xml
            filePath: ${{ steps.discover.output.bw_module_files[0] }}
            xPath: "/*/*[local-name()='service']/*[local-name()='binding']/@path"
          ref_names:
            type: xml
            filePath: ${{ steps.discover.output.bw_module_files[0] }}
            xPath: "/*/*[local-name()='reference']/@name"

    - id: processes
      name: Analyse Each Process
      action: tibco:extract-parameters
      each: ${{ steps.discover.output.bw_processes }}
      input:
        failOnError: true
        sourcePath: ${{ parameters.application_folder }}
        extractParameters:
          p_name:
            type: xml
            filePath: ${{ each.value }}
            xPath: "string(/*/@name)"
          p_types:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='BWActivity']/@activityTypeID"
          p_type_names:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='BWActivity']/ancestor::*[@name][1]/@name"
          p_acts:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='BWActivity'][not(starts-with(@activityTypeID,'bw.internal.')) and not(starts-with(@activityTypeID,'bw.generalactivities.'))]"
          p_act_names:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='BWActivity'][not(starts-with(@activityTypeID,'bw.internal.')) and not(starts-with(@activityTypeID,'bw.generalactivities.'))]/ancestor::*[@name][1]/@name"
          p_calls:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='CallProcess']/@subProcessName"
          p_rest_ops:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='onMessage']/@operation"
          p_rest_links:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='onMessage']/@partnerLink"
          p_link_srcs:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='sources']"
          p_link_src_owner:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='sources']/parent::*/@name"
          p_link_tgts:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='targets']"
          p_link_tgt_owner:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='targets']/parent::*/@name"
          p_binds:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='inputBinding']"
          p_bind_owner:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='inputBinding']/ancestor::*[@name][1]/@name"
          p_links:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='link'][@*[local-name()='linkType']]"
          p_groups:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='scope'][@*[local-name()='group']]/@name"
          p_refs:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='ReferenceBinding']"
          p_ref_names:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='ReferenceBinding']/parent::*/@name"
          p_invk_pl:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='invoke']/@partnerLink"
          p_invk_names:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='invoke']/@name"
          p_invk_ops:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='invoke']/@operation"
          p_vars:
            type: xml
            filePath: ${{ each.value }}
            xPath: "//*[local-name()='variable']/@name"
          p_catch:
            type: xml
            filePath: ${{ each.value }}
            xPath: "string(count(//*[local-name()='catch' or local-name()='catchAll']))"

    - id: schemas
      name: Read the Schemas
      action: tibco:extract-parameters
      each: ${{ steps.discover.output.bw_schemas }}
      input:
        failOnError: true
        sourcePath: ${{ parameters.application_folder }}
        extractParameters:
          s_elems:
            type: xml
            filePath: ${{ each.value }}
            xPath: "/*/*[local-name()='element']/@name"
          s_types:
            type: xml
            filePath: ${{ each.value }}
            xPath: "/*/*[local-name()='complexType' or local-name()='simpleType']/@name"

    - id: generate
      name: Generate Catalog Entities and Docs
      action: fetch:template
      input:
        url: ./entity-skeletons-bw-deep/
        targetPath: ${{ parameters.outputFolder }}
        templateFileExtension: true
        # Re-running the flow must regenerate the files: by default fetch:template skips
        # files that already exist, which would silently keep the output of an earlier run.
        replace: true
        values:
          scm: ${{ parameters.scm }}
          repoUrl: ${{ parameters.repoUrl }}
          branch: ${{ (parameters.branchOther or parameters.branch) }}
          application_folder: ${{ parameters.application_folder }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          domain: ${{ parameters.domain }}
          lifecycle: ${{ parameters.lifecycle }}
          createSystem: ${{ parameters.createSystem }}
          outputFolder: ${{ parameters.outputFolder }}
          infraMode: ${{ parameters.infraMode }}
          processDiagrams: ${{ parameters.processDiagrams }}
          app_dir: ${{ steps.discover.output.bw_app_files[0] | replace("/META-INF/TIBCO.xml", "") }}
          module_dir: ${{ steps.discover.output.bw_module_files[0] | replace("/META-INF/module.bwm", "") }}
          bw_processes: ${{ steps.discover.output.bw_processes }}
          bw_resources: ${{ steps.discover.output.bw_resources }}
          bw_swagger_files: ${{ steps.discover.output.bw_swagger_files }}
          bw_wsdl_files: ${{ steps.discover.output.bw_wsdl_files }}
          bw_schemas: ${{ steps.discover.output.bw_schemas }}
          bw_app_name: ${{ steps.extract.output.bw_app_name }}
          bw_app_description: ${{ steps.extract.output.bw_app_description }}
          bw_app_version: ${{ steps.extract.output.bw_app_version }}
          bw_version: ${{ steps.extract.output.bw_version }}
          bw_edition: ${{ steps.extract.output.bw_edition }}
          bw_palettes: ${{ steps.extract.output.bw_palettes }}
          bw_gv_names: ${{ steps.extract.output.bw_gv_names }}
          bw_gv_values: ${{ steps.extract.output.bw_gv_values }}
          bw_mod_gv_names: ${{ steps.extract.output.bw_mod_gv_names }}
          bw_mod_gv_values: ${{ steps.extract.output.bw_mod_gv_values }}
          bw_api_title: ${{ steps.extract.output.bw_api_title }}
          bw_api_description: ${{ steps.extract.output.bw_api_description }}
          bw_api_version: ${{ steps.extract.output.bw_api_version }}
          bw_api_base_path: ${{ steps.extract.output.bw_api_base_path }}
          bw_api_paths: ${{ steps.extract.output.bw_api_paths }}
          bw_svc_names: ${{ steps.module.output.svc_names }}
          bw_svc_paths: ${{ steps.module.output.svc_paths }}
          bw_ref_names: ${{ steps.module.output.ref_names }}
          bw_p_name: ${{ steps.processes.output.p_name }}
          bw_p_types: ${{ steps.processes.output.p_types }}
          bw_p_type_names: ${{ steps.processes.output.p_type_names }}
          bw_p_acts: ${{ steps.processes.output.p_acts }}
          bw_p_vars: ${{ steps.processes.output.p_vars }}
          bw_p_binds: ${{ steps.processes.output.p_binds }}
          bw_p_bind_owner: ${{ steps.processes.output.p_bind_owner }}
          bw_p_links: ${{ steps.processes.output.p_links }}
          bw_p_groups: ${{ steps.processes.output.p_groups }}
          bw_p_refs: ${{ steps.processes.output.p_refs }}
          bw_p_ref_names: ${{ steps.processes.output.p_ref_names }}
          bw_p_invk_pl: ${{ steps.processes.output.p_invk_pl }}
          bw_p_invk_names: ${{ steps.processes.output.p_invk_names }}
          bw_p_invk_ops: ${{ steps.processes.output.p_invk_ops }}
          bw_p_act_names: ${{ steps.processes.output.p_act_names }}
          bw_p_calls: ${{ steps.processes.output.p_calls }}
          bw_p_rest_ops: ${{ steps.processes.output.p_rest_ops }}
          bw_p_rest_links: ${{ steps.processes.output.p_rest_links }}
          bw_p_catch: ${{ steps.processes.output.p_catch }}
          bw_p_srcs: ${{ steps.processes.output.p_link_srcs }}
          bw_p_srcn: ${{ steps.processes.output.p_link_src_owner }}
          bw_p_tgts: ${{ steps.processes.output.p_link_tgts }}
          bw_p_tgtn: ${{ steps.processes.output.p_link_tgt_owner }}
          bw_s_elems: ${{ steps.schemas.output.s_elems }}
          bw_s_types: ${{ steps.schemas.output.s_types }}
          bw_tests: ${{ steps.discover.output.bw_tests }}
          bw_artifacts: ${{ steps.discover.output.bw_artifacts }}

    - id: push
      name: Commit the Generated Files
      action: tibco:git:push
      input:
        failOnError: true
        branch: ${{ (parameters.branchOther or parameters.branch) }}
        commitMessage: Add catalog entities generated by the BusinessWorks deep import flow

    - id: register
      name: Register in the Catalog
      action: catalog:register
      input:
        catalogInfoUrl: ${{ (("https://" + (parameters.repoUrl | parseRepoUrl).host + "/projects/" + ((parameters.repoUrl | parseRepoUrl).workspace if parameters.scm == "bitbucket-cloud" else ((parameters.repoUrl | parseRepoUrl).project if parameters.scm == "bitbucket-server" else (parameters.repoUrl | parseRepoUrl).owner)) + "/repos/" + (parameters.repoUrl | parseRepoUrl).repo + "/browse/" + parameters.outputFolder + "/catalog-info.yaml" + "?at=refs/heads/" + (parameters.branchOther or parameters.branch)) if parameters.scm == "bitbucket-server" else ("https://" + (parameters.repoUrl | parseRepoUrl).host + "/" + ((parameters.repoUrl | parseRepoUrl).workspace if parameters.scm == "bitbucket-cloud" else ((parameters.repoUrl | parseRepoUrl).project if parameters.scm == "bitbucket-server" else (parameters.repoUrl | parseRepoUrl).owner)) + "/" + (parameters.repoUrl | parseRepoUrl).repo + ("/blob/" if parameters.scm == "github" else ("/-/blob/" if parameters.scm == "gitlab" else ("/src/" if parameters.scm == "bitbucket-cloud" else "/src/branch/"))) + (parameters.branchOther or parameters.branch) + "/" + parameters.outputFolder + "/catalog-info.yaml")) }}

  output:
    links:
      - title: Open in catalog (Component)
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Business Works Documentation
        icon: catalog
        url: https://docs.tibco.com/products/tibco-activematrix-businessworks
